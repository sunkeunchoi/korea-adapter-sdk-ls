# Error-coverage evidence for t1444 (시가총액상위 — per-board market-cap
# ranking) — R10/R11.
#
# Records the per-(field, class) coverage derived from constraints/t1444.yaml
# and the reachable gateway codes the Reference page explains from the shared
# catalog.
#
# PROBED: this artifact is backed by a live differential negative probe
# (`make live-smoke-t1444-negative`, R10) run on the real paper gateway
# (2026-08-14, same session as the Focused Evidence smoke). The valid control
# succeeded (rsp_cd=00000, ok=true); the injected invalid variants read either
# `Clean` (a genuine IGW40011 reject: idx/type and idx/required) or
# `expected-tolerant` (the gateway accepts the violation but the SDK enforces
# it at preflight as a caller contract — gateway_tolerant, observed for THIS TR
# on /stock/high-item on its first probe pass and marked from that evidence:
# upcode/required). Zero Held, zero Divergent, no residual IGW00201 throttle
# (probe paced at 1000 ms — the figure the /stock/chart legs settled
# empirically for the same warm-sensitive cumulative market-data budget, and 2×
# this TR's own 2/s per-TR cap). The required-omission tolerance profile
# matches the /stock/chart siblings (t8410/t8412) and t8430, which is
# corroborating (comparable ingress), but the pair below was observed for t1444
# itself, not inherited. The recommendation therefore does NOT assert
# gateway-side rejection of the tolerant pair (see the TR's `excludes`).
#
# SESSION NOTE (differs from the t8430 exemplar): this probe and its control
# ran OFF-session — past 15:30 KST on 2026-08-14, a day that itself reads
# Unknown on the KRX calendar snapshot, so no proven Trading Session is claimed
# either way — which is a valid
# control for this TR, not a weakened one: the smoke registry certifies t1444
# "any session (certified UNDER closure)", and a ranking board is a snapshot
# read. What that costs is stated honestly in the TR's `excludes`: this
# evidence proves off-session reachability, and in-session serving during an
# open KRX window is NOT certified by it.
#
# `status` legend: confirmed = the differential probe confirmed the bound
# (rejected distinctly, IGW40011); tolerant = the gateway accepted the injected
# violation but preflight enforces it as a caller contract (gateway_tolerant,
# expected-tolerant — non-blocking); held = inconclusive; divergent = observed
# behavior disagreed with the declaration; n_a = the class does not apply / no
# variant is generated (string fields get no type-mutation variant;
# required-omission variants fire only for required:true fields).
tr_code: t1444
probe_status: clean
seed: "upcode=001 (KOSPI), idx=0 — the certified smoke shape (T1444Request::new(\"001\"), first page). idx crosses the wire as a JSON number via string_as_number (IGW40011 guard); a quoted numeric control would trip the ingress and mask the differential."
input_classes:
  - { field: upcode, class: type, status: n_a }              # string field — no type-mutation variant is generated
  - { field: upcode, class: required, status: tolerant }     # omit accepted → 00000 (gateway defaults the board); preflight still enforces (gateway_tolerant, expected-tolerant)
  - { field: upcode, class: enum, status: n_a }              # open board/sector code space — no enum declared (R6)
  - { field: upcode, class: range, status: n_a }
  - { field: upcode, class: format, status: n_a }            # 3-digit board code: neither FormatKind::Symbol nor ::Date
  - { field: idx, class: type, status: confirmed }           # non-numeric cursor rejected distinctly (IGW40011)
  - { field: idx, class: required, status: confirmed }       # omitted cursor rejected distinctly (IGW40011)
  - { field: idx, class: enum, status: n_a }
  - { field: idx, class: range, status: n_a }
  - { field: idx, class: format, status: n_a }
# Reachable gateway codes for this read TR, explained once from the shared
# catalog (R8/R9). Environment/entitlement codes are not reproduced per TR —
# they point at the same catalog entries.
gateway_codes:
  - "00000"
  - "00136"
  - "00707"
  - "904"
  - "01900"
  - IGW40011
