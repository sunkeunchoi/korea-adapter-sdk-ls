# Focused Evidence — t8430 (주식종목조회 / full stock-issue list, the
# universe-skeleton master read)
#
# A durable, credential-free record of a genuine Paper Live Smoke that fetched
# the full stock-issue master list. The `line` below is captured VERBATIM from
# the `LIVE-SMOKE` stdout of `make live-smoke-t8430`
# (crates/ls-sdk/tests/live/market_session_masters.rs::live_smoke_t8430). The
# smoke emits no `rsp_msg` (localized, account-identifying text) — only the
# numeric `rsp_cd` plus a public structural `issues` count — so a verbatim
# capture stays credential-free, matching the token/t1101/t8410 evidence shape.
#
# Secret-safety: structural descriptors only — never the token, appkey, secret,
# or account number. The read takes no caller identifier (`gubun="0"` is the
# all-markets filter); `date` is the capture date; `issues` is a master-list
# row count.
#
# Integrity of THIS record: `rsp_cd=00000` (gateway success) plus a non-empty
# `issues=4297` count confirm a genuine full-list round-trip through the
# header-less Object Array response shape (`t8430OutBlock` modeled as
# Vec<T8430OutBlock> via `de_vec_or_single`; an empty list would not record).
# The master list is characterized session-independent (implement-wave
# observation), but THIS record's smoke ran in-window (KRX open, 2026-08-12),
# so it proves in-window reachability only — off-session serving is excluded
# from the recommendation scope. The differential probe below shares the
# smoke's session.
#
# Differential certification (in-window 2026-08-12, KRX open, same session as
# the smoke): the error-resilience gate (`make live-smoke-t8430-negative`) ran
# CLEAN on the real paper gateway. The valid control succeeded (rsp_cd=00000);
# the injected invalid variants read `Clean` (a genuine IGW40011 reject:
# gubun/enum) or `expected-tolerant` (the gateway accepts the violation but the
# SDK enforces it at preflight as a caller contract — gateway_tolerant,
# observed for THIS TR on /stock/etc on its first probe pass and marked from
# that evidence: gubun/required). Zero Held, zero Divergent, no IGW00201
# throttle (probe paced at 1000 ms — the /stock/chart-settled figure for the
# same warm-sensitive cumulative market-data budget, which page-bursting this
# very TR once tripped). The recommendation therefore does NOT assert
# gateway-side rejection of the tolerant pair (see the TR's `excludes`).
