tr_code: CSPAT00701
name: 현물정정주문 (cash equity order modify)
owner_class: orders
facets:
  protocol: rest
  instrument_domain: stock
  venue_session: krx_regular
  date_sensitive: false
  self_paginated: false
  account_state: true
  paper_incompatible: false
  certification_path: manual
  rate_bucket: orders
  # IsuNo (종목번호) and OrgOrdNo (원주문번호) are the caller-supplied inputs that
  # select the order being modified. The remaining required fields (OrdQty/OrdPrc/
  # OrdprcPtnCode/OrdCndiTpCode) are the new target values, not identifiers.
  caller_supplied_identifiers: [OrgOrdNo, IsuNo]
dependencies:
  self_continuation_fields: []
  # Order-identity fields — the semantically strong inputs that define a unique
  # modify for deduplication. A modify is absolute (it carries the full target
  # OrdQty/OrdPrc), so two identical re-sends against the same OrgOrdNo are the
  # "same order" action and must dedup.
  strong_order_fields: [OrgOrdNo, IsuNo, OrdQty, OrdPrc]
support:
  # Recommended: modify leg certified on a clean in-window guarded paper order-chain
  # smoke (rsp_cd 00462 정정주문 완료; `make live-smoke-order-chain`, plan 2026-06-30-002),
  # the live order-placement evidence ADR 0008 deferred the Recommended endorsement on.
  # The §30 negative differential HELD on OrdprcPtnCode/required → IGW00000 (conservative
  # may-rest halt); an attended seed/fire/teardown A/B (2026-07-15) characterized it
  # PLACED-NOTHING and the full differential then re-probed CLEAN via the Route B scoped
  # tolerance (constraints/CSPAT00701.yaml placed_nothing_codes; plan 2026-07-14-001,
  # ledger §31). The account was positively confirmed flat after the run. See
  # docs/design/order-safety-design.md.
  tracked: true
  implemented: true
  recommended: true
maintenance:
  source_spec_hash: bfd073603ce2
  last_reviewed: 2026-07-15
recommendation:
  behavior: Paper cash-equity order modify of a caller-owned resting order, keyed by OrgOrdNo (absolute new target qty/price/pattern; the modify leg of the submit→modify→cancel chain)
  evidence_ref: evidence/CSPAT00701.yaml
  excludes:
    - Modification of orders the caller does not own (the smoke modifies only its own resting OrgOrdNo)
    - Production-credential order modifies (evidence is paper only)
    - Fill / settlement or resulting-balance correctness beyond a successful modify-accepted round-trip
    - Modify behavior on partially-filled or already-terminal orders beyond the resting-order modify exercised
    - Gateway-side enforcement of an omitted OrdprcPtnCode — the undocumented IGW00000 reject is characterized placed-nothing for the differential PROBE only; the runtime seam still treats it as may-rest → reconcile via t0425 (Route B; is_ingress_validation_reject unchanged)
    - Stronger freshness automation than the stated policy (no enforcement in code today)
constraints_ref: constraints/CSPAT00701.yaml
error_coverage_ref: error-coverage/CSPAT00701.yaml
