tr_code: t0425
name: 주식체결/미체결 (stock filled/unfilled order inquiry)
# Read-only order/execution inquiry — the reconciliation companion to the
# CSPAT00601 submit. Classed `paginated` (not `account`) because it self-continues
# on the `cts_ordno` order-number cursor; routed through the market_data bucket
# (KTD5). is_order is false — this is a read.
owner_class: paginated
facets:
  protocol: rest
  instrument_domain: stock
  venue_session: krx_regular
  date_sensitive: false
  self_paginated: true
  account_state: false
  paper_incompatible: false
  certification_path: none
  rate_bucket: market_data
  # `expcode` (종목번호) is the only caller-supplied identifier; chegb/medosu/sortgb
  # are mode/filter flags and cts_ordno is the pagination cursor — none are
  # identifiers.
  caller_supplied_identifiers: [expcode]
dependencies:
  self_continuation_fields: [cts_ordno]
  strong_order_fields: []
support:
  # Recommended: order-reconciliation read exercised by a clean in-window guarded
  # paper order-chain smoke (returned valid 완료/정정확인 rows; the account-flat scan
  # confirmed the book flat; `make live-smoke-order-chain`, plan 2026-06-30-002).
  # The reconciliation companion to the CSPAT00601 submit, promoted alongside the
  # order legs it reconciles.
  tracked: true
  implemented: true
  recommended: true
maintenance:
  source_spec_hash: e6eff49b1783
  last_reviewed: 2026-07-13
recommendation:
  behavior: Paper read-only order fill/unfilled reconciliation read of the working-order book for the token-bound account (self-continued on the cts_ordno cursor; the reconciliation companion to the CSPAT00601 submit)
  evidence_ref: evidence/t0425.yaml
  excludes:
    - Order- or position-mutating state (read-only reconciliation inquiry only)
    - Production-credential order-book reads (evidence is paper only)
    - Multi-page cts_ordno continuation correctness beyond the pages the order-chain run observed
    - Order-status / field correctness beyond a successful reconciliation round-trip
    - Gateway-side rejection of an omitted chegb/medosu — preflight enforces these locally, the gateway tolerates their absence (gateway_tolerant; the differential probe reads the accepted removal as expected-tolerant)
    - Stronger freshness automation than the stated policy (no enforcement in code today)
constraints_ref: constraints/t0425.yaml
error_coverage_ref: error-coverage/t0425.yaml
