name: Repository engineering check

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      - name: Test repository engineering package
        run: cargo +1.96.0 test --locked -p ls-repository-engineering
      - name: Check package and standalone runtime
        run: make repository-engineering-check
      - name: Lint repository engineering package
        run: cargo +1.96.0 clippy --locked -p ls-repository-engineering --all-targets -- -D warnings
      - name: Lint standalone runtime
        run: cargo +1.96.0 clippy --locked --manifest-path tools/repository-engineering-runtime/Cargo.toml --all-targets -- -D warnings
      - name: Lint Orca Runner attended proof
        run: cargo +1.96.0 clippy --locked --manifest-path tools/orca-runner-proof/Cargo.toml --all-targets -- -D warnings
