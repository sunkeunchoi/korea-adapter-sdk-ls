schema_version = "v0"
capability_id = "audit-carried-rows"
public_description = "Audits every carried or discard row and produces credential-free per-row records plus a roll-up gate."
autonomy = "A3"
safety_overlays = ["no_external_mutation", "human_gate", "path_confined", "redacted_diagnostics"]
inputs = []
outcomes = ["succeeded", "held", "cancelled", "policy_violated", "failed", "recovery_required"]
touched_paths = [
  ".compound-engineering/runs/audit-carried-rows",
  "docs/migration-source/audit/records",
  "docs/migration-source/audit/decommission-audit-report.md",
  "docs/migration-source-extraction-ledger.md",
]
evidence_obligations = [
  "per-row-credential-free-records",
  "roll-up-gate-report",
  "decommission-audit-validator-pass",
  "source-coverage-reconciliation",
]
human_gates = ["attended-paper-readonly-session", "unverifiable-maintainer-acceptance"]
legacy_authority_dependencies = ["capability--audit-row", "run-state-consumer--audit-carried-rows"]
worker_roles = ["decommission-row-auditor"]
scenario_references = []

[state]
declaration = "declared"
implementation = "unported"
certification = "uncertified"
authority = "legacy"
retirement = "not_started"

[credential_boundary]
credential_free_scopes = ["package-authored-state", "checkpoints", "committed-records", "diagnostics"]

[credential_boundary.future_executor]
attendance = "required"
credential_scope = "minimum"
environment = "paper-readonly"
review_requirements = ["credential-sourcing", "process-environment-isolation", "redaction", "trading-environment-selection"]

[coordination_semantics]
coverage = "complete_manifest_reconciliation"
assignment = "fresh_worker_per_row"
checkpoint_owner = "orchestrator_only"
phases = ["discovering", "dispatching", "rolling_up", "gate_computed", "complete"]
roll_up = "serial_after_all_rows_terminal"

[[coordination_semantics.dispatch_cohorts]]
cohort_id = "knowledge-discard"
candidate_classes = ["knowledge", "discard"]
concurrency = "parallel"

[[coordination_semantics.dispatch_cohorts]]
cohort_id = "behavioral"
candidate_classes = ["behavioral"]
concurrency = "bounded_parallel"
max_concurrency = 2

[coordination_semantics.resume]
completed_assignment_policy = "skip_after_record_revalidation"
orphan_record_policy = "reconcile_as_objective_fact"
mismatch_outcome = "held"

[[coordination_semantics.terminal_conditions]]
outcome = "succeeded"
condition = "complete_coverage_and_committed_validator_pass"

[[coordination_semantics.terminal_conditions]]
outcome = "held"
condition = "unresolved_rows"

[[coordination_semantics.terminal_conditions]]
outcome = "recovery_required"
condition = "inconsistent_persisted_state"

[evidence_status]
legacy_status = "available_validated"
successor_implementation = "absent"
parity = "unproved"
certification = "uncertified"
legacy_evidence_satisfies_successor = false

